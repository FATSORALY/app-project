version: '3.9'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=localhost
      - DB_NAME=appdb
      - DB_USER=appuser
      - DB_PASSWORD=ChangeMe123!
    restart: unless-stopped

  # Optionnel : PostgreSQL local pour tests
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ChangeMe123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: